[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contrail-optimization"
version = "0.1.0"
description = "Contrail-aware flight-option optimizer: synthetic airspace environment + CP-SAT solver behind a gRPC/ZMQ service with a PyQt6 desktop client."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "jaewonyun1234" }]
keywords = ["optimization", "cp-sat", "contrails", "grpc", "zmq", "pyqt6"]

# Core runtime = the headless solver service (gRPC + ZMQ). Deliberately does
# NOT include the PyQt6 desktop dashboard so the deployed server image stays
# small and free of GUI/X11 system dependencies. The dashboard pulls its deps
# from the `gui` extra below.
dependencies = [
    "numpy>=1.26",
    "ortools>=9.10",
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
    "pyzmq>=25.0",
]

[project.optional-dependencies]
# PyQt6 desktop dashboard (client side only). Install with: pip install -e ".[gui]"
gui = [
    "PyQt6>=6.6",
    "pyqtgraph>=0.13",
    "PyOpenGL>=3.1",
]
dev = [
    "pytest>=8.0",
    "mypy>=1.8",
    "ruff>=0.4",
]
# Observation-grounded ISSR model + full MLOps lifecycle. Install with:
#   pip install -e ".[ml]"
# Deliberately NOT in the core deps: the deployed solver image (Dockerfile
# runtime stage) must stay lean and free of the heavy scientific/geo stack.
# The geo loaders (pycontrails/xarray/cfgrib/zarr/gcsfs/netCDF4/dask) are only
# needed to BUILD a dataset from real weather; training/serving/tests on a
# prepared parquet need only the tabular stack (pandas/scipy/sklearn/xgboost).
ml = [
    "pycontrails>=0.60",
    "xarray>=2024.0",
    "netCDF4",
    "cfgrib",            # GFS is GRIB
    "zarr",
    "gcsfs",             # ARCO-ERA5 is zarr on a public GCS bucket
    "dask",
    "pandas>=2.0",
    "pyarrow",
    "scipy",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "mlflow>=2.12",
    "matplotlib",        # reliability / diagnostic plots logged to MLflow
    "tabulate",          # markdown rendering of the comparison table for MLflow
]
# Real historical-traffic loader (OpenSky). The package's geometry + reduction
# run on numpy alone; this extra is only needed to actually PULL and CACHE real
# tracks (pyopensky + the tabular stack). Like [ml], it is NOT in the core deps,
# so the deployed solver image stays lean.
flights = [
    "pyopensky>=2.0",
    "pandas>=2.0",
    "pyarrow",
]
# Real quantum SDK backends. The pipelines run WITHOUT these (built-in
# statevector / exact-hafnian samplers); installing them switches
# pasqal_analog to Pulser's QuTiP emulator and xanadu_gbs to Strawberry
# Fields' gaussian backend automatically (backend="auto").
quantum = [
    "pulser>=0.21",
    "pulser-simulation>=0.21",
    "strawberryfields>=0.23",
]

[project.urls]
Repository = "https://github.com/jaewonyun1234/Flight_path_optimization_Contrail"

# ---------------------------------------------------------------------------
# Packaging — two top-level packages live at the repo root.
# `service.generated` is created at build/CI time by scripts/gen_proto.sh and
# is intentionally NOT listed (it is gitignored); the editable install exposes
# the `service` directory so the generated subpackage imports fine once built.
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
# Auto-discover packages present in the build context. Locally this finds
# contrail_env, service, contrail_ml, and contrail_ml.data. Inside the Docker
# build context, contrail_ml is excluded via .dockerignore so only
# contrail_env and service are found — pip install . succeeds either way.
where = ["."]

# ---------------------------------------------------------------------------
# Ruff — lint the code we add in this layer. The nine pre-existing
# `contrail_env` modules are treated as vendored source (the brief forbids
# modifying them), so they are excluded; the new solver and the whole service/
# gui/tests tree are linted normally.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
extend-exclude = [
    "service/generated",
    "contrail_env/__init__.py",
    "contrail_env/demo.py",
    "contrail_env/units.py",
    "contrail_env/synthetic_issr.py",
    "contrail_env/airspace.py",
    "contrail_env/world.py",
    "contrail_env/aircraft.py",
    "contrail_env/flight.py",
    "contrail_env/options.py",
    "contrail_env/qubo.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

# The ML test modules call pytest.importorskip(...) before importing contrail_ml
# so the core lint-type-test job (no [ml] extra) skips them instead of erroring.
# That guard must run before the imports it protects, which is exactly E402.
[tool.ruff.lint.per-file-ignores]
"tests/test_ml_*.py" = ["E402"]

# ---------------------------------------------------------------------------
# Mypy — fully type-check the new code. The pre-existing modules cannot be
# edited, so their (best-effort) type errors are not enforced; the new
# solver_cpsat module and the service package ARE enforced.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
exclude = ["service/generated", "build/"]

# Pre-existing env modules are vendored (the brief forbids editing them), so
# their best-effort type errors are not enforced.
[[tool.mypy.overrides]]
module = [
    "contrail_env.units",
    "contrail_env.synthetic_issr",
    "contrail_env.airspace",
    "contrail_env.world",
    "contrail_env.aircraft",
    "contrail_env.flight",
    "contrail_env.options",
    "contrail_env.qubo",
    "contrail_env.demo",
]
ignore_errors = true

# protoc-generated stubs use runtime metaclass magic that static analysis
# cannot see; treat the whole generated package as Any.
[[tool.mypy.overrides]]
module = ["service.generated.*"]
follow_imports = "skip"
ignore_errors = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
