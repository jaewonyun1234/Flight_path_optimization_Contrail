[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contrail-optimization"
version = "0.2.0"
description = "Minimal contrail-aware flight-option QUBO: analog-QAOA + Bayesian optimization vs brute force and a random baseline."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "jaewonyun1234" }]
keywords = ["optimization", "qubo", "contrails", "quantum", "neutral-atoms"]

dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.8",
    "ruff>=0.4",
]
# Optional real quantum SDK backend. The pipeline runs WITHOUT it (built-in
# statevector simulator); installing it lets pasqal_analog use Pulser's
# QuTiP emulator automatically (backend="auto") when the graph embeds.
quantum = [
    "pulser>=0.21",
    "pulser-simulation>=0.21",
]

[project.urls]
Repository = "https://github.com/jaewonyun1234/Flight_path_optimization_Contrail"

[tool.setuptools.packages.find]
where = ["."]
include = ["contrail_env*"]

[tool.ruff]
line-length = 100
extend-exclude = ["playground"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
exclude = ["build/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
