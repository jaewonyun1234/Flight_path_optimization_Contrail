# Brings up the containerized CP-SAT solver service.
#
#   docker compose up --build
#
# Then point a client (or the PyQt6 dashboard) at localhost:50051; live solver
# progress is published on tcp://localhost:5556.
services:
  solver:
    build:
      context: .
      dockerfile: Dockerfile
    image: contrail-solver:latest
    container_name: contrail-solver
    ports:
      - "50051:50051"   # gRPC Solve RPC
      - "5556:5556"     # ZMQ progress stream
    environment:
      CONTRAIL_GRPC_HOST: "0.0.0.0"
      CONTRAIL_GRPC_PORT: "50051"
    restart: unless-stopped
