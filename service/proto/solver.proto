syntax = "proto3";
package contrail;

// A scenario CONFIG, not a pre-built problem. The server reconstructs the
// whole contrail_env scenario from these fields, so the wire format is tiny
// and fully reproducible from (seed, sizes, weights).
message ScenarioConfig {
  int32  seed = 1;
  int32  n_flights = 2;
  int32  n_issr_blobs = 3;
  double alpha_fuel = 4;          // cost weight on fuel (kg)
  double beta_contrail = 5;       // cost weight on contrail cells
  double gamma_disruption = 6;    // cost weight on disruption (FL-min)
  double corridor_frac = 7;       // flight clustering (default 0.02-0.25)
  double snapshot_window_s = 8;   // upper bound of departure window (lower = 0)
  double time_limit_s = 9;        // CP-SAT time limit
  string progress_topic = 10;     // ZMQ topic to publish progress on
  double issr_threshold = 11;     // RHi-excess above which a cell forms a contrail
  // ML ISSR source (plan §7). Default "" == "synthetic", so existing clients
  // are unaffected. "ml" builds the world's ISSR from a trained model.
  string issr_source = 12;        // "synthetic" (default) or "ml"
  string issr_time = 13;          // ISO valid-time for the ML forecast (optional)
  double issr_p_threshold = 14;   // calibrated P(ISSR) cut for is_inside (0 -> default)
  // Real historical-traffic source (contrail_flights / OpenSky). Default
  // "" == "synthetic", so existing clients are unaffected. "real" pulls actual
  // flown ADS-B tracks for the window below and reduces them to flights.
  string flight_source = 15;      // "synthetic" (default) or "real"
  string flight_start_time = 16;  // ISO start of the historical pull window
  string flight_end_time = 17;    // ISO end of the historical pull window
}

message FlightChoice {
  string flight_name = 1;
  int32  chosen_option = 2;
  double fuel_kg = 3;
  int32  contrail_cells = 4;
  double disruption_flmin = 5;
}

message SolveResponse {
  double objective = 1;
  string status = 2;
  double wall_clock_s = 3;
  int32  n_conflicts = 4;
  int32  n_options_total = 5;
  repeated FlightChoice choices = 6;
}

service Solver {
  rpc Solve(ScenarioConfig) returns (SolveResponse);
}
